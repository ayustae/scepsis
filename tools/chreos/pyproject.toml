[project]
name = "chreos"
version = "0.2.0"
description = "Task, project and decision manager CLI of the Scepsis framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "click==8.5.0",
    "ruamel.yaml==0.19.1",
    "tomlkit==0.15.1",
]

[project.scripts]
chreos = "chreos.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
